name: macos-appleid9
on:
  workflow_dispatch:
jobs:
  safari9:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APPLE_CC: 'GB'
      APPLE_NAT: '7450699185'
      APPLE_INBOX: 'https://asms.ai/number/447450699185'
    steps:
      - uses: actions/checkout@v4
      - name: env probe
        run: |
          sw_vers; uname -m; sysctl -n hw.model || true
          python3 -V; safaridriver --version || true
      - name: build Apple Vision OCR helpers
        run: |
          swiftc -O ocr2.swift -o /tmp/ocr2 && ls -l /tmp/ocr2 || echo OCR2_BUILD_FAILED
          swiftc -O ocr3.swift -o /tmp/ocr3 && ls -l /tmp/ocr3 || echo OCR3_BUILD_FAILED
      - name: enable and start safaridriver (headful GUI session)
        run: |
          sudo -n safaridriver --enable || echo "ENABLE_FAILED"
          defaults write com.apple.Safari AllowJavaScriptFromAppleEvents -bool true || true
          nohup safaridriver --port 4444 > "$RUNNER_TEMP/safaridriver.log" 2>&1 &
          sleep 3
          curl -s -m 8 http://127.0.0.1:4444/status || echo "STATUS_FAILED"
      - name: apple signup with server-side email-domain oracle
        run: |
          cd "$GITHUB_WORKSPACE"; ls -la
          python3 apple_wd9.py 2>&1 || true
      - name: redact credentials before upload
        if: always()
        run: |
          python3 redact9.py 2>&1 || true
          python3 -c "import json;d=json.load(open('out9/summary9.json'));print('STAGE=',d.get('stage'));print('EVENTS=',len(d.get('events',[])))" 2>/dev/null || true
      - name: post-run messages probe
        if: always()
        run: |
          open -a Messages 2>&1 || true
          sleep 5
          osascript -e 'tell application "Messages" to get name of every account' 2>&1 || true
          pgrep -lf imagent || true
          sqlite3 ~/Library/Messages/chat.db "select count(*) from message" 2>/dev/null || echo no_chatdb
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appleid-evidence9
          path: |
            out9
            ${{ runner.temp }}/safaridriver.log
          if-no-files-found: warn
