name: macos-discover
on:
  workflow_dispatch:
jobs:
  disc:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: discover readable free-sms inboxes
        run: |
          cd "$GITHUB_WORKSPACE"; python3 discover2.py 2>&1 || true
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover2-evidence
          path: out2
          if-no-files-found: warn
